name: enterprise-knowledge-search

x-app-environment: &app-environment
  EKS_ENVIRONMENT: development
  EKS_LOG_LEVEL: ${EKS_LOG_LEVEL:-INFO}
  EKS_DATABASE_URL: postgresql+psycopg://knowledge_search:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/knowledge_search
  EKS_REDIS_URL: redis://redis:6379/0
  EKS_QDRANT_URL: http://qdrant:6333
  EKS_DOCUMENT_STORAGE_PATH: /app/data/documents
  EKS_MODEL_CACHE_PATH: /app/model-cache
  EKS_ANSWER_PROVIDER: ${EKS_ANSWER_PROVIDER:-disabled}
  EKS_ANSWER_BASE_URL: ${EKS_ANSWER_BASE_URL:-http://host.docker.internal:11434/v1}
  EKS_ANSWER_MODEL: ${EKS_ANSWER_MODEL:-qwen2.5:3b}
  EKS_ANSWER_API_TOKEN: ${EKS_ANSWER_API_TOKEN:-}

x-app-service: &app-service
  build:
    context: .
  image: enterprise-knowledge-search:local
  environment: *app-environment
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=128m,mode=1777
  volumes:
    - document_data:/app/data/documents
    - model_cache:/app/model-cache

services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: enterprise-knowledge-search-postgres:local
    environment:
      POSTGRES_DB: knowledge_search
      POSTGRES_USER: knowledge_search
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U knowledge_search -d knowledge_search
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2.15-alpine3.21@sha256:05a97a479bc73de66f087dc05b569010772880f778cc8671fa6b8aadee32e5c6
    command:
      - redis-server
      - --appendonly
      - "yes"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  qdrant:
    build:
      context: .
      dockerfile: docker/qdrant/Dockerfile
    image: enterprise-knowledge-search-qdrant:local
    volumes:
      - qdrant_data:/qdrant/storage

  migrate:
    <<: *app-service
    command:
      - alembic
      - upgrade
      - head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-service
    command:
      - uvicorn
      - knowledge_search.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 10s
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  worker:
    <<: *app-service
    command:
      - python
      - -m
      - knowledge_search.worker.main
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

volumes:
  document_data:
  model_cache:
  postgres_data:
  qdrant_data:
  redis_data:
