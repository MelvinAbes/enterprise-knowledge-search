[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "enterprise-knowledge-search"
version = "0.1.0"
description = "A traceable document retrieval and question-answering service."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.136,<1",
    "markdown-it-py>=4.0,<5",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "pypdf>=6.0,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.17,<2",
    "pip-audit>=2.10,<3",
    "pytest>=8.4,<10",
    "reportlab>=4.4,<5",
    "ruff>=0.12,<1",
    "testcontainers[postgres]>=4.15,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_search"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
markers = [
    "integration: requires a local Docker-compatible container runtime",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["knowledge_search"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
pretty = true
show_error_codes = true
warn_unreachable = true

[[tool.mypy.overrides]]
# ReportLab is used only to build deterministic PDF fixtures and does not publish typing metadata.
module = ["reportlab.*"]
ignore_missing_imports = true
